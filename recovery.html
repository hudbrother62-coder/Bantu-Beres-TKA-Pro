<!doctype html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pemulihan Akun | Bantu Beres TKA Pro</title>
<style>
:root{font:16px system-ui,sans-serif;color-scheme:light dark}
body{margin:0;background:#f2f5fa;color:#1e293b;min-height:100vh;display:grid;place-items:center}
main{background:white;width:min(440px,calc(100% - 36px));padding:28px;box-sizing:border-box;border-radius:16px;border:1px solid #e2e8f0;box-shadow:0 16px 44px #0f172a12}
small{font-weight:700;letter-spacing:.06em;color:#64748b}h1{font-size:26px;line-height:1.2;margin:10px 0}p{color:#64748b;line-height:1.6}
label{display:block;margin-top:14px;font-weight:600}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #94a3b8;border-radius:9px;margin-top:6px;font:inherit}textarea{min-height:85px}
button{background:#344fa7;color:white;padding:12px;border:0;border-radius:9px;font:inherit;font-weight:650;cursor:pointer;margin-top:16px}button:disabled{opacity:.55}a{color:#344fa7}
#notice{white-space:pre-wrap;color:#047857;font-size:14px}#error{white-space:pre-wrap;color:#b91c1c;font-size:14px}
[hidden]{display:none!important}
@media(prefers-color-scheme:dark){body{background:#101b2c;color:#ecf3ff}main{background:#1c2b42;border-color:#334763}p,small{color:#b8c9e3}input,textarea{background:#132238;color:#fff;border-color:#52627a}a{color:#a7bcff}}
</style></head>
<body><main><small>BANTU BERES · TKA PRO</small><h1 id="title">Pemulihan password</h1><p id="description">Gunakan kode pemulihan yang sudah kamu simpan ketika masih login.</p>
<p id="error" role="alert"></p><p id="notice" role="status"></p>
<form id="setup-form" hidden><label>Password saat ini<input type="password" id="current-password" required autocomplete="current-password"></label><button type="submit">Buat kode pemulihan</button></form>
<form id="redeem-form" hidden><label>Username<input id="username" required autocomplete="username" maxlength="120" placeholder="Username TKA Pro"></label>
<label>Kode pemulihan<input id="code" required autocomplete="off" maxlength="60" placeholder="Tempel kode tersimpan"></label>
<label>Password baru<input id="new-password" type="password" required minlength="8" maxlength="128" autocomplete="new-password"></label>
<label>Konfirmasi password<input id="confirm-password" type="password" required minlength="8" maxlength="128" autocomplete="new-password"></label>
<button type="submit">Ganti password</button></form>
<section id="generated" hidden><label>Kode pemulihan — simpan di tempat aman<textarea id="recovery-code" readonly></textarea></label><button id="copy" type="button">Salin kode</button></section>
<p><a href="/#/login">Kembali ke aplikasi</a></p></main><script type="module" src="/src/recovery.js"></script></body></html>
